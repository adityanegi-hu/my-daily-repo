name: Daily Auto Commit

on:
  schedule:
    - cron: '30 13 * * *' # 21:30 UTC = 3:00 AM IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-auto-commit
  cancel-in-progress: false

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update log file
        run: echo "Update on $(date '+%Y-%m-%d %H:%M:%S %Z')" >> log.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log.txt

          if git diff --staged --quiet; then
            echo "No changes to commit, skipping push"
            exit 0
          fi

          git commit -m "Daily update: $(date +%Y-%m-%d)"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push failed, retrying ($i)..."
            sleep $((RANDOM % 5 + 1))
          done

          echo "Failed to push after retries"
          exit 1
